name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni

      - name: Install dependencies
        run: nci

      - name: Compute base path and target folder
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "base=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
            echo "target=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${{ github.event.repository.name }}/${{ github.ref_name }}/" >> "$GITHUB_OUTPUT"
            echo "target=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: nr build --base "${{ steps.vars.outputs.base }}"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: ${{ steps.vars.outputs.target }}
          clean: true
